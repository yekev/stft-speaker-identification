<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title description">
  <title id="title">Speaker-identification processing pipeline</title>
  <desc id="description">A static seven-stage pipeline from a 48 kilohertz WAV recording through waveform preprocessing and log-power STFT to ResNet-18 speaker probabilities.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="1580" height="340" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="54" y="61" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">Audio-to-speaker pipeline</text>
  <text x="54" y="92" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="17">Deterministic evaluation path · baseline configuration</text>

  <g fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 238 195 H 264"/>
    <path d="M 458 195 H 484"/>
    <path d="M 678 195 H 704"/>
    <path d="M 898 195 H 924"/>
    <path d="M 1118 195 H 1144"/>
    <path d="M 1338 195 H 1364"/>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="44" y="135" width="194" height="120" rx="17" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="70" cy="151" r="17" fill="#2563eb"/>
    <text x="70" y="157" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">1</text>
    <text x="141" y="184" text-anchor="middle" fill="#1e3a8a" font-size="21" font-weight="700">Input WAV</text>
    <text x="141" y="219" text-anchor="middle" fill="#475569" font-size="17">48 kHz speech</text>

    <rect x="264" y="135" width="194" height="120" rx="17" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="290" cy="151" r="17" fill="#7c3aed"/>
    <text x="290" y="157" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">2</text>
    <text x="361" y="184" text-anchor="middle" fill="#5b21b6" font-size="20" font-weight="700">Mono &amp; Normalize</text>
    <text x="361" y="219" text-anchor="middle" fill="#475569" font-size="17">peak amplitude</text>

    <rect x="484" y="135" width="194" height="120" rx="17" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="510" cy="151" r="17" fill="#0284c7"/>
    <text x="510" y="157" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">3</text>
    <text x="581" y="184" text-anchor="middle" fill="#075985" font-size="21" font-weight="700">Resample</text>
    <text x="581" y="219" text-anchor="middle" fill="#475569" font-size="17">16 kHz</text>

    <rect x="704" y="135" width="194" height="120" rx="17" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <circle cx="730" cy="151" r="17" fill="#16a34a"/>
    <text x="730" y="157" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">4</text>
    <text x="801" y="184" text-anchor="middle" fill="#166534" font-size="21" font-weight="700">Crop / Pad</text>
    <text x="801" y="219" text-anchor="middle" fill="#475569" font-size="17">3 seconds</text>

    <rect x="924" y="135" width="194" height="120" rx="17" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="950" cy="151" r="17" fill="#d97706"/>
    <text x="950" y="157" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">5</text>
    <text x="1021" y="184" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Log-power STFT</text>
    <text x="1021" y="219" text-anchor="middle" fill="#475569" font-size="17">1 × 257 × 301</text>

    <rect x="1144" y="135" width="194" height="120" rx="17" fill="#fee2e2" stroke="#fb7185" stroke-width="2"/>
    <circle cx="1170" cy="151" r="17" fill="#e11d48"/>
    <text x="1170" y="157" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">6</text>
    <text x="1241" y="184" text-anchor="middle" fill="#9f1239" font-size="21" font-weight="700">ResNet-18</text>
    <text x="1241" y="219" text-anchor="middle" fill="#475569" font-size="17">1-channel input</text>

    <rect x="1364" y="135" width="194" height="120" rx="17" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="1390" cy="151" r="17" fill="#0f766e"/>
    <text x="1390" y="157" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">7</text>
    <text x="1461" y="184" text-anchor="middle" fill="#115e59" font-size="20" font-weight="700">Speaker Scores</text>
    <text x="1461" y="219" text-anchor="middle" fill="#475569" font-size="17">24 actor classes</text>
  </g>

  <rect x="906" y="282" width="230" height="40" rx="20" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1021" y="308" text-anchor="middle" fill="#9a3412" font-family="Segoe UI, Arial, sans-serif" font-size="15">25 ms window · 10 ms hop · FFT 512</text>
</svg>
